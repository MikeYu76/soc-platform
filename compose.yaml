services:
  soc-platform:
    build: .
    container_name: soc-platform-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SOC_API_HOST: 0.0.0.0
      SOC_API_PORT: 8000
      SOC_DATABASE_BACKEND: postgresql
      SOC_POSTGRES_HOST: postgres
      SOC_POSTGRES_PORT: 5432
      SOC_POSTGRES_DATABASE: ${SOC_POSTGRES_DB:-soc_platform}
      SOC_POSTGRES_USER: ${SOC_POSTGRES_USER:-soc_platform}
      SOC_POSTGRES_PASSWORD: ${SOC_POSTGRES_PASSWORD:?Set SOC_POSTGRES_PASSWORD in .env}
      SOC_JWT_SECRET: ${SOC_JWT_SECRET:?Set SOC_JWT_SECRET in .env}
      SOC_ACCESS_TOKEN_EXPIRE_MINUTES: ${SOC_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SOC_BOOTSTRAP_ADMIN_USERNAME: ${SOC_BOOTSTRAP_ADMIN_USERNAME:?Set SOC_BOOTSTRAP_ADMIN_USERNAME in .env}
      SOC_BOOTSTRAP_ADMIN_PASSWORD: ${SOC_BOOTSTRAP_ADMIN_PASSWORD:?Set SOC_BOOTSTRAP_ADMIN_PASSWORD in .env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:18.6-alpine
    container_name: soc-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SOC_POSTGRES_DB:-soc_platform}
      POSTGRES_USER: ${SOC_POSTGRES_USER:-soc_platform}
      POSTGRES_PASSWORD: ${SOC_POSTGRES_PASSWORD:?Set SOC_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: soc-platform-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set OPENSEARCH_INITIAL_ADMIN_PASSWORD in .env}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost:9200 | grep -Eq '200|401'"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 10

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    container_name: soc-platform-dashboards
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set OPENSEARCH_INITIAL_ADMIN_PASSWORD in .env}
      OPENSEARCH_SSL_VERIFICATIONMODE: none
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  postgres-data:
  opensearch-data:

